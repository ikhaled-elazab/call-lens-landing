<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dashTitle dashDesc">
  <title id="dashTitle">Call Lens sample call analysis dashboard</title>
  <desc id="dashDesc">Illustrative dashboard showing a call score of 87, guideline compliance indicators, talk-time ratio, sentiment trend, and a coaching recommendation card.</desc>
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16335E"/>
      <stop offset="1" stop-color="#0F2647"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="560" height="420" rx="20" fill="url(#panelGrad)"/>

  <!-- header bar -->
  <text x="28" y="40" fill="#CCFBF1" font-family="Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">CALL ANALYSIS</text>
  <text x="28" y="62" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="700">Support Call · Rep: J. Alvarez</text>
  <rect x="440" y="24" width="96" height="26" rx="13" fill="#0B1E39" stroke="#14B8A6" stroke-width="1"/>
  <text x="488" y="42" fill="#2DD4BF" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SCORED</text>

  <!-- score ring -->
  <g transform="translate(96,140)">
    <circle r="58" fill="none" stroke="#0B1E39" stroke-width="14"/>
    <circle r="58" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="303 364" transform="rotate(-90)"/>
    <text x="0" y="8" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="34" font-weight="700" text-anchor="middle">87</text>
    <text x="0" y="30" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Guideline Score</text>
  </g>

  <!-- metric bars -->
  <g font-family="Inter, sans-serif">
    <text x="200" y="96" fill="#94A3B8" font-size="12">Talk-Time Ratio</text>
    <rect x="200" y="102" width="220" height="10" rx="5" fill="#0B1E39"/>
    <rect x="200" y="102" width="132" height="10" rx="5" fill="#14B8A6"/>
    <text x="428" y="111" fill="#FFFFFF" font-size="12" font-weight="600">60 / 40</text>

    <text x="200" y="136" fill="#94A3B8" font-size="12">Sentiment Trend</text>
    <rect x="200" y="142" width="220" height="10" rx="5" fill="#0B1E39"/>
    <rect x="200" y="142" width="176" height="10" rx="5" fill="#2DD4BF"/>
    <text x="428" y="151" fill="#FFFFFF" font-size="12" font-weight="600">+80%</text>

    <text x="200" y="176" fill="#94A3B8" font-size="12">Guideline Compliance</text>
    <rect x="200" y="182" width="220" height="10" rx="5" fill="#0B1E39"/>
    <rect x="200" y="182" width="198" height="10" rx="5" fill="#22C55E"/>
    <text x="428" y="191" fill="#FFFFFF" font-size="12" font-weight="600">90%</text>
  </g>

  <!-- sentiment sparkline -->
  <g transform="translate(28,224)">
    <text x="0" y="0" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Sentiment Over Call</text>
    <polyline points="0,40 40,32 80,44 120,20 160,26 200,8 240,14 280,6"
      fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="280" cy="6" r="4" fill="#2DD4BF"/>
  </g>

  <!-- coaching recommendation card -->
  <g transform="translate(28,296)">
    <rect x="0" y="0" width="504" height="96" rx="14" fill="#0B1E39" stroke="#14B8A6" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="96" rx="2" fill="#14B8A6"/>
    <text x="20" y="26" fill="#2DD4BF" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">COACHING RECOMMENDATION</text>
    <text x="20" y="50" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="600">Talk-time imbalance detected at 06:12</text>
    <text x="20" y="72" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Suggest a discovery-questions drill in next 1:1 — rep spoke 60% of call vs. 45% guideline target.</text>
  </g>
</svg>
